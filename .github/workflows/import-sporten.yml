name: Import Sporten Kalendar

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Read Sporten Kalendar into pins
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: 22
          command_timeout: 30m
          script: |
            set -eu
            cd /var/www/kostaa
            sudo -u www-data /usr/bin/php8.4 artisan pins:import-sporten
