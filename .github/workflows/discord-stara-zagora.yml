name: Discord Stara Zagora test

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Post the Stara Zagora roundup
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: 22
          command_timeout: 5m
          script: |
            set -eu
            cd /var/www/kostaa
            /usr/bin/php8.4 artisan pins:discord-live stara-zagora
