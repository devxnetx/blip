name: Facebook cities

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Import the remaining cities
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: 22
          command_timeout: 350m
          script: |
            set -eu
            cd /var/www/kostaa
            PHP=/usr/bin/php8.4
            HELPER=/tmp/kostaa-fb-spend.php
            cat > "$HELPER" <<'PHP'
            <?php
            chdir('/var/www/kostaa');
            require '/var/www/kostaa/vendor/autoload.php';
            $app = require '/var/www/kostaa/bootstrap/app.php';
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $action = $argv[1] ?? 'spend';
            if ($action === 'spend') {
                echo number_format(app(App\Services\FacebookEvents\Client::class)->usageUsd(), 4, '.', ''), PHP_EOL;
                exit(0);
            }
            if ($action === 'on') {
                App\Models\Setting::put('import_facebook_enabled', '1');
                echo 'flag=1', PHP_EOL;
                exit(0);
            }
            if ($action === 'off') {
                App\Models\Setting::put('import_facebook_enabled', '0');
                echo 'flag=0', PHP_EOL;
                exit(0);
            }
            if ($action === 'flag') {
                echo 'flag='.(App\Models\Setting::get('import_facebook_enabled') ?? 'null'), PHP_EOL;
                exit(0);
            }
            if ($action === 'unlock') {
                Illuminate\Support\Facades\Cache::lock('pins-import-facebook')->forceRelease();
                echo 'unlocked', PHP_EOL;
                exit(0);
            }
            if ($action === 'runs') {
                $token = config('services.apify.token');
                if (! is_string($token) || $token === '') {
                    fwrite(STDERR, "missing token\n");
                    exit(1);
                }
                $response = Illuminate\Support\Facades\Http::withToken($token)
                    ->acceptJson()
                    ->timeout(60)
                    ->get('https://api.apify.com/v2/acts/unseenuser~fb-events/runs', [
                        'limit' => 5,
                        'desc' => 1,
                    ]);
                if (! $response->successful()) {
                    fwrite(STDERR, 'runs http '.$response->status().PHP_EOL);
                    exit(1);
                }
                $items = $response->json('data.items');
                if (! is_array($items)) {
                    echo 'runs=0', PHP_EOL;
                    exit(0);
                }
                foreach ($items as $item) {
                    if (! is_array($item)) {
                        continue;
                    }
                    echo ($item['id'] ?? '').' '.($item['status'] ?? '').' usd='.($item['usageTotalUsd'] ?? '').' started='.($item['startedAt'] ?? ''), PHP_EOL;
                }
                exit(0);
            }
            fwrite(STDERR, "unknown\n");
            exit(1);
            PHP
            chmod 644 "$HELPER"
            asweb() { runuser -u www-data -- "$PHP" "$@"; }
            restore() { asweb "$HELPER" off || true; rm -f "$HELPER"; }
            trap restore EXIT
            echo "CAP usd=18.00 plan=19.00"
            echo "BEFORE $(asweb "$HELPER" flag)"
            echo "SPEND_BEFORE $(asweb "$HELPER" spend)"
            if ps -eo comm=,args= | awk '$1 ~ /^php/ && index($0, "pins:import-facebook") { found=1 } END { exit found ? 0 : 1 }'; then
              echo "ALREADY RUNNING"
              exit 1
            fi
            asweb "$HELPER" unlock
            asweb "$HELPER" on
            for city in stara-zagora ruse pleven dobrich shumen pernik haskovo pazardzhik blagoevgrad vratsa gabrovo vidin montana lovech kardzhali kyustendil razgrad silistra targovishte smolyan; do
              echo "CITY_START $city"
              before=$(asweb "$HELPER" spend)
              echo "SPEND_CITY_BEFORE $city $before"
              if awk "BEGIN { exit !($before+0 >= 18) }"; then
                echo "BUDGET STOP $city usd=$before"
                break
              fi
              asweb /var/www/kostaa/artisan pins:import-facebook "$city" --wide
              after=$(asweb "$HELPER" spend)
              echo "SPEND_CITY_AFTER $city $after"
              asweb "$HELPER" runs
            done
            echo "SPEND_AFTER $(asweb "$HELPER" spend)"
            echo "AFTER $(asweb "$HELPER" flag)"
